name: Desktop

on:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  build:
    name: Build / ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            platform: windows-latest
            args: ""
          - label: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - label: macos-x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Prepare desktop runtime bundle
        run: node scripts/prepare-desktop-runtime.mjs

      - name: Bundle Node.js sidecar
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION=22.18.0
          DEST=apps/desktop/src-tauri/binaries
          mkdir -p "$DEST"
          case "${{ matrix.label }}" in
            windows-x64)
              curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip" -o /tmp/node.zip
              unzip -j /tmp/node.zip "node-v${NODE_VERSION}-win-x64/node.exe" -d "$DEST"
              mv "$DEST/node.exe" "$DEST/node-x86_64-pc-windows-msvc.exe"
              ;;
            macos-arm64)
              curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o /tmp/node.tgz
              tar -xzf /tmp/node.tgz -C /tmp
              install -m 755 "/tmp/node-v${NODE_VERSION}-darwin-arm64/bin/node" "$DEST/node-aarch64-apple-darwin"
              ;;
            macos-x64)
              curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-x64.tar.gz" -o /tmp/node.tgz
              tar -xzf /tmp/node.tgz -C /tmp
              install -m 755 "/tmp/node-v${NODE_VERSION}-darwin-x64/bin/node" "$DEST/node-x86_64-apple-darwin"
              ;;
            *)
              echo "Unknown matrix label: ${{ matrix.label }}"
              exit 1
              ;;
          esac

      - name: Require GitHub Client ID for release builds
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -z "${{ vars.OPEN_PAGES_GITHUB_CLIENT_ID }}" ]; then
            echo "::error::Release builds need repository variable OPEN_PAGES_GITHUB_CLIENT_ID (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPEN_PAGES_GITHUB_CLIENT_ID: ${{ vars.OPEN_PAGES_GITHUB_CLIENT_ID }}
          # Ad-hoc signature. Without it Gatekeeper reports the bundle as damaged
          # on Apple Silicon instead of offering the "open anyway" path. Pair with
          # entitlements.plist so the Node sidecar may JIT under Hardened Runtime.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Open Pages ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseBody: |
            ### Windows 安装

            下载 `.exe` 直接运行，装过旧版也不用先卸载：安装程序会先结束正在运行的
            Open Pages 和它的 Node 后台进程，再覆盖安装。

            ### macOS 安装

            推荐用命令行安装，自动选架构，没有安全提示：

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-macos.sh | sh
            ```

            如果从下面的附件下载（Apple Silicon 选 `aarch64`，Intel 选 `x64`），
            首次打开会提示"已损坏，无法打开"——安装包未经 Apple 公证，浏览器下载时
            打上了隔离标记。把 app 拖进「应用程序」后执行一次即可：

            ```bash
            xattr -dr com.apple.quarantine "/Applications/Open Pages.app"
            ```

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-pages-desktop-${{ matrix.label }}-${{ github.run_number }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required / desktop builds passed
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled, or skipped desktop builds
        if: needs.build.result != 'success'
        run: exit 1
      - run: echo "All desktop platform builds passed."
