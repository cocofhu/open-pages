<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2c2a26" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Open Pages</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #efe8dc; color: #1c1915; font-family: "Avenir Next", "PingFang SC", "Segoe UI", sans-serif; }
      .boot-screen { display: grid; place-items: center; height: 100%; padding: 24px; }
      .studio-loading { width: min(360px, 100%); text-align: center; padding: 28px; border: 1px solid #d8cebf; border-radius: 20px; background: #fffdf8; box-shadow: 0 18px 50px rgba(28, 25, 21, 0.12); }
      .studio-loading-kicker { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6d6558; }
      .studio-loading h3 { margin: 0 0 8px; font-size: 20px; }
      .studio-loading-copy { margin: 0 0 18px; color: #6d6558; font-size: 14px; }
      .studio-loading-bar { height: 6px; border-radius: 999px; background: #efe8dc; overflow: hidden; }
      .studio-loading-bar i { display: block; height: 100%; width: 18%; background: #c45c26; border-radius: inherit; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" data-testid="boot">
        <div class="studio-loading" role="status" aria-live="polite" aria-busy="true">
          <p class="studio-loading-kicker">Open Pages</p>
          <h3>正在打开…</h3>
          <p class="studio-loading-copy">正在加载站点资源</p>
          <div class="studio-loading-bar" aria-hidden="true"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
